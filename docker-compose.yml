version: '3.8'

services:
  whiteboard-tutor:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: whiteboard-tutor-app
    ports:
      - "5000:5000"
    environment:
      - PORT=5000
      - NODE_ENV=production
      - GEMINI_API_KEY=${GEMINI_API_KEY:-}
      - CORS_ORIGIN=*
    restart: unless-stopped
